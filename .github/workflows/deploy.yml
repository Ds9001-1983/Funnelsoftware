name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nur ein Deploy gleichzeitig: neue Pushes in schneller Folge werden
# gereiht, nicht parallel ausgeführt. Sonst konkurrieren mehrere
# `npm ci` + `npm run build` um /var/www/funnelflow und kippen sich
# gegenseitig (zuletzt beobachtet: „Could not resolve ./_hashClear").
# cancel-in-progress: false → laufender Deploy wird nicht abgebrochen,
# sondern läuft sauber zu Ende; nachfolgende Pushes warten.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/funnelflow
            git fetch origin main
            # Skript und Release stammen exakt aus dem von CI geprüften Commit.
            DEPLOY_SCRIPT="$(mktemp /tmp/trichterwerk-deploy.XXXXXXXX)"
            trap 'rm -f "$DEPLOY_SCRIPT"' EXIT
            git show '${{ github.sha }}:scripts/deploy-production.sh' > "$DEPLOY_SCRIPT"
            bash "$DEPLOY_SCRIPT" '${{ github.sha }}'
