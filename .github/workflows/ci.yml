name: CI

on:
  workflow_call:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check:all

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: funnelsoftware_e2e
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/funnelsoftware_e2e
      BUILDER_LAYOUT_EDITOR: "true"
      BUILDER_ROUTING_EDITOR: "true"
      BUILDER_PERSONALIZATION_EDITOR: "true"
      BUILDER_LIBRARY_EDITOR: "true"
      BUILDER_RESPONSIVE_EDITOR: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # webServer-Command legt die DB an (No-op, der Service hat sie schon),
      # pusht das Schema und startet den Dev-Server.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Database integration and migration tests
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          WORKSPACE_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          RECRUITING_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          RECRUITING_MAIL_INTEGRATION: "1"
          WEBHOOK_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          MIGRATION_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          REVISION_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          LIBRARY_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          BRAND_STYLE_TEST_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run test:run -- server/webhook-jobs.integration.test.ts server/recruiting.integration.test.ts server/workspaces.integration.test.ts server/recruiting-mail.integration.test.ts server/funnel-revisions.integration.test.ts server/brand-styles.integration.test.ts server/builder-library.integration.test.ts scripts/migrate.test.mjs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
