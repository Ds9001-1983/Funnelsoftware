# Legacy platform alias. Requires an existing certificate for this hostname.
# Install separately from customer-domains so the provisioner's cleanup cannot
# remove a platform vhost. The canonical application remains trichterwerk.de.
server {
    listen 443 ssl http2;
    server_name app.trichterwerk.de;

    ssl_certificate /etc/letsencrypt/live/app.trichterwerk.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.trichterwerk.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://trichterwerk.de$request_uri;
}
